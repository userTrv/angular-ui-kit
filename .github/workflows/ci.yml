name: CI

on:
  push:
    branches: [main]
  pull_request:

# Права GITHUB_TOKEN по минимуму: только чтение кода.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Экшены закреплены по SHA коммита: тег можно перевесить, коммит — нет.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Токен GITHUB_TOKEN не остаётся в .git/config для следующих шагов.
          persist-credentials: false
      # Версия pnpm берётся из packageManager в package.json (с хешем).
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (tokens, public API report, ESLint)
        run: pnpm lint
      - name: Unit, component and axe tests
        run: pnpm test
      - name: Build library and docs site
        run: pnpm build
      - name: Install Chromium for the a11y run
        run: pnpm exec playwright-core install --with-deps chromium
      - name: axe-core in a real browser (all docs pages, 3 themes)
        run: pnpm test:a11y
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-site
          path: dist
          retention-days: 7
