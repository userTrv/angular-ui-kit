name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (tokens, public API report, ESLint)
        run: pnpm lint
      - name: Unit, component and axe tests
        run: pnpm test
      - name: Build library and docs site
        run: pnpm build
      - name: Install Chromium for the a11y run
        run: pnpm exec playwright-core install --with-deps chromium
      - name: axe-core in a real browser (all docs pages, 3 themes)
        run: pnpm test:a11y
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: dist
          retention-days: 7
