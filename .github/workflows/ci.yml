name: CI

on:
  push:
    branches: [main]
  pull_request:

# Права GITHUB_TOKEN по минимуму: только чтение кода.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Экшены закреплены по SHA коммита: тег можно перевесить, коммит — нет.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Токен GITHUB_TOKEN не остаётся в .git/config для следующих шагов.
          persist-credentials: false
      # Версия pnpm берётся из packageManager в package.json (с хешем).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (tokens, public API report, ESLint)
        run: pnpm lint
      - name: Unit, component and axe tests
        run: pnpm test
      - name: Build library and docs site
        run: pnpm build
      - name: Install Chromium for the a11y run
        run: pnpm exec playwright-core install --with-deps chromium
      - name: axe-core in a real browser (all docs pages, 3 themes)
        run: pnpm test:a11y
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site
          path: dist
          retention-days: 7
