<header class="topbar">
  <a class="skip-link" href="#/" (click)="focusMain($event)">Skip to content</a>
  <button
    type="button"
    class="topbar__menu"
    aria-controls="docs-nav"
    [attr.aria-expanded]="navOpen()"
    aria-label="Navigation menu"
    (click)="navOpen.set(!navOpen())"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
  </button>
  <a routerLink="/" class="brand" aria-label="@usertrv/ui home">
    <span class="brand__mark" aria-hidden="true">
      <svg viewBox="0 0 32 32"><rect x="3" y="3" width="12" height="12" rx="3" /><rect x="17" y="3" width="12" height="12" rx="6" /><rect x="3" y="17" width="12" height="12" rx="6" /><rect x="17" y="17" width="12" height="12" rx="3" /></svg>
    </span>
    <span class="brand__name">&#64;usertrv/<strong>ui</strong></span>
  </a>
  <div class="topbar__controls">
    <label class="control">
      <span class="control__label">Theme</span>
      <select (change)="setTheme($any($event.target).value)">
        @for (t of themes; track t.value) {
          <option [value]="t.value" [selected]="t.value === theme.theme()">{{ t.label }}</option>
        }
      </select>
    </label>
    <div class="segmented" role="group" aria-label="Density">
      <button type="button" [attr.aria-pressed]="theme.density() === 'comfortable'" (click)="setDensity('comfortable')">Comfortable</button>
      <button type="button" [attr.aria-pressed]="theme.density() === 'compact'" (click)="setDensity('compact')">Compact</button>
    </div>
    <a class="topbar__github" href="https://github.com/userTrv/angular-ui-kit" aria-label="Source on GitHub">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z" /></svg>
    </a>
  </div>
</header>

<div class="layout">
  <nav id="docs-nav" class="sidebar" [class.sidebar--open]="navOpen()" aria-label="Documentation">
    <p class="sidebar__heading">Overview</p>
    <ul>
      <li><a routerLink="/" routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ exact: true }">Getting started</a></li>
      <li><a routerLink="/theming" routerLinkActive="active" ariaCurrentWhenActive="page">Theming &amp; tokens</a></li>
    </ul>
    @for (group of groups(); track group.label) {
      <p class="sidebar__heading">{{ group.label }}</p>
      <ul>
        @for (item of group.items; track item.slug) {
          <li>
            <a [routerLink]="['/components', item.slug]" routerLinkActive="active" ariaCurrentWhenActive="page">{{ item.name }}</a>
          </li>
        }
      </ul>
    }
  </nav>
  @if (navOpen()) {
    <div class="scrim" aria-hidden="true" (click)="navOpen.set(false)"></div>
  }
  <main id="main" class="content" tabindex="-1">
    <router-outlet />
  </main>
</div>
